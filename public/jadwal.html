<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2B3EBF">
    <title>Atur Jadwal - Gas Baee</title>
    <link rel="icon" href="/favicon.png">
    <script>tailwind = { config: { theme: { extend: { colors: { slate: { 50: '#FDF6E7', 100: '#FAEBD0', 200: '#EFD8B0', 400: '#9C93B8', 500: '#6D6797', 700: '#2E3490', 800: '#1F2670', 900: '#151A52' }, blue: { 100: '#FFE8BF', 200: '#FFD48A', 500: '#F4A027', 600: '#E5890F' } } } } } }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap');

        body {
            font-family: Nunito, sans-serif;
            background: #FDF5E6 radial-gradient(rgba(43, 62, 191, .12) 1.5px, transparent 1.5px) 0 0/22px 22px
        }

        h1,
        h2 {
            font-family: 'Lilita One', sans-serif;
            font-weight: 400
        }

        .card {
            border: 3px solid #151A52;
            box-shadow: 5px 5px 0 #2B3EBF
        }

        .d {
            aspect-ratio: 1;
            border: 2px solid transparent
        }

        .nav {
            box-shadow: 3px 3px 0 #2B3EBF
        }
    </style>
</head>

<body class="text-slate-800 min-h-screen p-4 py-6">
    <div class="max-w-md mx-auto space-y-4">
        <nav class="flex flex-wrap justify-between gap-2">
            <div class="flex gap-2">
                <a href="/admin"
                    class="nav px-3 py-2 bg-white border-2 border-slate-900 rounded-lg text-sm font-extrabold"><i
                        class="fa-solid fa-arrow-left"></i> Sorter</a>
                <a href="/admin/links"
                    class="nav px-3 py-2 bg-white border-2 border-slate-900 rounded-lg text-sm font-extrabold"><i
                        class="fa-solid fa-sliders"></i> Link</a>
            </div>
            <a href="/api/logout"
                class="px-3 py-2 bg-slate-900 text-white border-2 border-slate-900 rounded-lg text-sm font-extrabold"><i
                    class="fa-solid fa-right-from-bracket"></i> Keluar</a>
        </nav>

        <div class="card bg-white rounded-2xl p-4">
            <h1 class="text-2xl leading-tight">Atur Jadwal Tim</h1>
            <p class="text-xs font-bold text-slate-500 mb-3">Ketuk tanggal untuk mengganti status: Tersedia → Terbatas →
                Penuh → Tersedia. Tersimpan otomatis.</p>
            <div class="flex items-center justify-between mb-3">
                <button onclick="nav(-1)" aria-label="Bulan sebelumnya"
                    class="w-10 h-10 rounded-lg border-2 border-slate-900"><i
                        class="fa-solid fa-chevron-left"></i></button>
                <h2 id="mt" class="text-xl"></h2>
                <button onclick="nav(1)" aria-label="Bulan berikutnya"
                    class="w-10 h-10 rounded-lg border-2 border-slate-900"><i
                        class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div id="wd" class="grid grid-cols-7 gap-1 text-center text-[11px] font-extrabold text-slate-500 mb-1">
            </div>
            <div id="g" class="grid grid-cols-7 gap-1"></div>
            <div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs font-bold">
                <span><i class="fa-solid fa-square text-green-300"></i> Tersedia</span>
                <span><i class="fa-solid fa-square text-blue-500"></i> Terbatas</span>
                <span><i class="fa-solid fa-square text-red-300"></i> Penuh</span>
            </div>
            <p id="msg" class="mt-2 text-xs font-bold h-4"></p>
        </div>
        <a href="/booking.html" target="_blank"
            class="block text-center text-sm font-extrabold underline text-slate-700">Lihat tampilan yang dilihat
            klien</a>
    </div>

    <script>
        const BL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const $ = id => document.getElementById(id), pad = n => String(n).padStart(2, '0');
        const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
        const t = new Date(), today = iso(t.getFullYear(), t.getMonth(), t.getDate());
        const NEXT = { free: 'limited', limited: 'full', full: 'free' };
        let y = t.getFullYear(), m = t.getMonth(), days = {};

        $('wd').innerHTML = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(x => `<div>${x}</div>`).join('');
        function nav(n) { m += n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } draw(); }
        function say(s, bad) { $('msg').textContent = s; $('msg').className = 'mt-2 text-xs font-bold h-4 ' + (bad ? 'text-red-600' : 'text-green-700'); }

        function draw() {
            $('mt').textContent = BL[m] + ' ' + y;
            const first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
            let h = '<div></div>'.repeat(first);
            for (let d = 1; d <= n; d++) {
                const k = iso(y, m, d), s = days[k], past = k < today;
                let c = 'bg-green-100 text-green-800 border-green-300';
                if (past) c = 'bg-slate-100 text-slate-400';
                else if (s === 'full') c = 'bg-red-100 text-red-700 border-red-300';
                else if (s === 'limited') c = 'bg-blue-200 text-slate-900 border-blue-600';
                h += `<button ${past ? 'disabled' : ''} onclick="tog('${k}')" class="d rounded-lg text-sm font-extrabold ${c}">${d}</button>`;
            }
            $('g').innerHTML = h;
        }

        async function load() {
            try {
                const r = await fetch('/api/schedule', { cache: 'no-store' });
                if (!r.ok) throw 0;
                days = (await r.json()).days || {};
                say('');
            } catch (e) { say('Gagal memuat jadwal. Pastikan database sudah terhubung.', true); }
            draw();
        }

        async function tog(k) {
            const nx = NEXT[days[k] || 'free'];
            if (nx === 'free') delete days[k]; else days[k] = nx;
            draw();
            try {
                const r = await fetch('/api/schedule', {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dates: [k], status: nx })
                });
                if (r.status === 401) { location.href = '/login'; return; }
                if (!r.ok) throw 0;
                say('Tersimpan.');
            } catch (e) { say('Gagal menyimpan, memuat ulang...', true); load(); }
        }
        load();
    </script>
</body>

</html>
